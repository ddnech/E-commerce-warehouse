
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-furnifor}
      MYSQL_USER: ${DB_USER:-furnifor}
      MYSQL_PASSWORD: ${DB_PASSWORD:-furnifor}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    ports:
      - "${DB_PORT:-3309}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Catches every email the app sends. Open http://localhost:8027 to read them.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8027}:8025"

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 8200
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      APP_URL: ${DOCKER_APP_URL:-http://localhost:3200}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-furnifor}
      DB_USER: ${DB_USER:-furnifor}
      DB_PASSWORD: ${DB_PASSWORD:-furnifor}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      USER_TOKEN_EXPIRES_IN: ${USER_TOKEN_EXPIRES_IN:-7d}
      ADMIN_TOKEN_EXPIRES_IN: ${ADMIN_TOKEN_EXPIRES_IN:-12h}
      PAYMENT_WINDOW_HOURS: ${PAYMENT_WINDOW_HOURS:-24}
      AUTO_COMPLETE_DAYS: ${AUTO_COMPLETE_DAYS:-7}
      BANK_ACCOUNT: ${BANK_ACCOUNT:-BCA 123 456 7890 a.n. PT Furnifor Indonesia}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      RAJAONGKIR_API_KEY: ${RAJAONGKIR_API_KEY:-}
      OPENCAGE_API_KEY: ${OPENCAGE_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DOCKER_SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Furnifor <no-reply@furnifor.local>}
    ports:
      - "${API_PORT:-8200}:8200"
    volumes:
      # Product photos and payment receipts survive rebuilds.
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-3200}:80"

volumes:
  db-data:
  uploads:
